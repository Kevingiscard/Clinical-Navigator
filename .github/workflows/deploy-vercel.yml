name: Deploy Vercel Production

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "api/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vercel.json"

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm references:validate
      - run: pnpm diagnostics:consistency
      - run: pnpm security:baseline
      - run: pnpm build

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$DATABASE_URL" || { echo 'DATABASE_URL is required'; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN is required'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'VERCEL_ORG_ID is required'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'VERCEL_PROJECT_ID is required'; exit 1; }
      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./
