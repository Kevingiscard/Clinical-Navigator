name: Clinical Navigator — Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Self-check
        run: pnpm self-check
      - name: Type-check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /Clinical-Navigator/
        run: pnpm build:static
      - name: Static smoke checks
        run: |
          test -f dist/public/index.html
          test -f dist/public/404.html || true
          grep -q "Clinical Navigator" dist/public/index.html
