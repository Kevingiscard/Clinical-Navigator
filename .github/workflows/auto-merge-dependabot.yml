name: Clinical Navigator — Safe Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["Clinical Navigator — Quality Gate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Find Dependabot PR for the tested branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_JSON=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number,author,title --limit 10)
          echo "$PR_JSON" > /tmp/pr.json
          NUMBER=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/pr.json'))
          for pr in data:
              if pr.get('author',{}).get('login') == 'dependabot[bot]':
                  print(pr['number'])
                  break
          PY
          )
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - name: Enable merge only for tested Dependabot update
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr review "$PR_NUMBER" --approve || true
          gh pr merge "$PR_NUMBER" --auto --squash || true
