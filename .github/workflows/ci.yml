name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm references:validate
      - run: pnpm diagnostics:consistency
      - run: pnpm knowledge:verify
      - run: pnpm knowledge:graph:verify
      - run: pnpm module:resources:validate
      - run: pnpm links:audit
      - run: pnpm security:baseline
      - run: pnpm build
      - run: pnpm build:static
      - run: pnpm artifact:verify
      - run: pnpm e2e
      - run: pnpm budget
