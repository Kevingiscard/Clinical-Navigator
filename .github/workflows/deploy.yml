name: Clinical Navigator — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: clinical-navigator-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Self-check
        run: pnpm self-check
      - name: Generate diagnostics
        run: pnpm diagnostics
      - name: Validate references
        run: pnpm references:validate
      - name: Clinical consistency
        run: pnpm diagnostics:consistency
      - name: Security baseline
        run: pnpm security:baseline
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build
        env:
          VITE_BASE_PATH: /Clinical-Navigator/
        run: pnpm build:static
      - name: GitHub Pages fallback
        run: cp dist/public/index.html dist/public/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
