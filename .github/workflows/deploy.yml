name: Clinical Navigator — Build & Verify

# La publication se fait sur Tencent EdgeOne (console, New Deployment). GitHub Pages n'est plus utilisé.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinical-navigator-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Self-check
        run: pnpm self-check
      - name: Generate diagnostics
        run: pnpm diagnostics
      - name: Validate references
        run: pnpm references:validate
      - name: Clinical consistency
        run: pnpm diagnostics:consistency
      - name: Security baseline
        run: pnpm security:baseline
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build
        env:
          VITE_BASE_PATH: /Clinical-Navigator/
          VITE_STATIC_ONLY: "true"
          VITE_API_BASE_URL: ""
        run: pnpm build:static
      - name: Verify GitHub Pages artifact
        run: pnpm artifact:verify
