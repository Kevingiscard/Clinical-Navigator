name: Clinical Navigator — Scheduled Maintenance

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level high || true
      - name: Create maintenance issue if a job failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Maintenance check failed — ${{ github.run_id }}" \
            --body "Automated maintenance detected a failure. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "maintenance" || true
