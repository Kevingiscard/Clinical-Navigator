version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 10
    groups:
      production-minor-patch:
        update-types: ["minor", "patch"]
      development-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]
